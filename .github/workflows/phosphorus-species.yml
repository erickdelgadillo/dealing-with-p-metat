name: Species-level phosphorus figures
on:
  push:
    branches: [feat/species-level-p-figures]
  pull_request:
    paths:
      - analysis/plot_species_phosphorus.R
      - data/phosphorus_indicators/**
      - data/derived/figure_6_correlations.csv
      - .github/workflows/phosphorus-species.yml

permissions:
  contents: read

jobs:
  species-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install plotting dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("ggplot2", "patchwork"))
      - name: Plot original species assignments
        run: Rscript --vanilla analysis/plot_species_phosphorus.R
      - name: Publish figures and audit tables
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-wp2-species-plots
          path: results/phosphorus_species/
          if-no-files-found: error
