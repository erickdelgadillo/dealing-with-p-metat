name: Phosphorus indicators

on:
  push:
    branches: [main, feat/phosphorus-taxon-indicators]
  pull_request:

permissions:
  contents: read

jobs:
  snapshot-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install downstream dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("dplyr", "ggplot2", "patchwork", "scales"))
      - name: Verify historical data checksums
        working-directory: data/derived
        run: sha256sum -c SHA256SUMS
      - name: Verify indicator snapshot checksums
        working-directory: data/phosphorus_indicators
        run: sha256sum -c SHA256SUMS
      - name: Check annotations, design, denominators, and models
        run: Rscript --vanilla tests/test_phosphorus_indicators.R
      - name: Reproduce indicator tables and figures
        run: Rscript --vanilla analysis/run_phosphorus_indicators.R
      - name: Preserve historical inputs, code, and artwork
        run: |
          git diff --exit-code 6a3d0c927d16515f684e27d675cad58bc5dff60d -- analysis/paper_figures.R data/derived results/figures
      - name: Upload reproducible indicator outputs
        uses: actions/upload-artifact@v4
        with:
          name: phosphorus-indicator-results
          path: results/phosphorus_indicators/
          if-no-files-found: error
